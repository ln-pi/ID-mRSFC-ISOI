# ==================================================
# Project Configuration
# ==================================================

# ---------- Info ----------
paths:
  raw: "F:\\OIS_Awake_Mice\\"
  processed: "D:\\data\\processed\\"
  output: "data\\output\\"
  mask: "data\\mask\\"
  log: "logs\\OIS.log"

variables:
  dataset: ""
  Week_ids: ["00w", "01w", "02w", "03w", "04w", "05w", "06w", "07w", "08w", "09w", "10w", "11w", "12w", "13w"]
  Mouse_ids: ["N01", "N02", "N03", "N04", "N05", "N06", "N07", "N08", "N09", "N10", "N11", "N12", "N13", "N14"]
  Run_ids: ["Run01", "Run02"]
  Atlas: [["SM", "VIS", "AUD"], ["PF", "LAT", "MED", "AUDv"], ["AUDv"]]

# ---------- Preprocess ----------
preprocess:
  keepna: False
  resume: True  # validate completed step outputs before skipping
  bin:
    time: 6
    space: 4
  filter:
    highpass: 0.005
    lopass: 1
    fps: 5
  robust: 2

# ---------- Correlation ----------
correlation:
  resume: True

# ---------- Analysis ----------
analysis:
  split_axis: week  # group runs; week groups weeks instead
  selection_mode: single  # process the opposite axis singly or cumulatively
  statistics_file: "statistics.pkl"  # shared by 03, 04 and 05

ID:
  completeness_mode: strict  # strict: all weeks/runs; cover: maximum complete mouse x contiguous week area
  group_mode: random  # sequential or random
  repeat_id: null  # ID or one-based position on the split axis; odd sequential only
  session_seed: 42  # reproducible random axis split
  shuffle: True
  n_iter: 1000

Edge:
  seed: 42
  repeat: 50
  threshold: 99
  gap: 0.25
  cross_only: False
  save_mat: True

supplement:
  structure_atlases: [["SM", "VIS", "AUD"], ["PF", "LAT", "MED", "AUDv"], ["AUDv"]]
  structure_group_names: ["Association", "Sensory excluding AUDv", "Whole Brain excluding AUDv"]
  exclude: []

# ---------- Visualization ----------
visualization:
  defaults:
    dpi: 180
    render_dpi: 300
    show: False
    save: True
    log: False

  fc_heatmap:
    figsize: [8, 8]
    center: 0
    vmin: -1
    vmax: 1
    square: True
    cmap: "coolwarm"
    cbar: True
    label_fontsize_small: 10
    label_fontsize_scale: 300

  id_shuffle_hist:
    figsize: [5, 4]
    bins: 20
    range: [0, 1]
    facecolor: "lightgray"
    edgecolor: "dimgray"
    arrow_color: "red"
    show_mean_arrow: True
    mean_arrow_color: "gray"
    xlabel: "Identification Accuracy"
    ylabel: "Count"
    title: "Shuffle Distribution"
    arrow_text_format: "real={:.4f}"
    mean_text_format: "shuffle={:.4f}"

  id_paired:
    figsize: [4, 6]
    linecolor: "gray"
    alpha: 0.5
    linewidth: 1.5
    meancolor: "red"
    meanwidth: 3
    xticklabels: ["Group", "Individual"]
    ylabel: "Network Similarity"

  id_similarity_matrix:
    figsize: [6, 6]
    title: "Similarity Matrix"
    cmap: "inferno"
    cbar: True
    axis: True
    vmin_default: 1.2
    vmax_default: 3.0
    vmin_association: 2.0
    vmax_association: 3.5
    tick_fontsize: 10

  edge_phi:
    node_color_mode: "fixed"
    edge_color_mode: "fixed"
    edge_fixed_color: "blue"
    edge_width_mode: "fixed"

  edge_dp:
    node_color_mode: "fixed"
    edge_color_mode: "fixed"
    edge_fixed_color: "red"
    edge_width_mode: "fixed"

  stat_box:
    figsize: [4, 4]
    box_width: 0.1
    box_alpha: 0.7
    box_color:
    showfliers: False
    fontsize: 7
    rotation: 0
    grid: False
    hide_ns: True

  stat_rel_effect_box:
    show_legend: False
    show_sub_label: True

  stat_group_indiv_box:
    group_gap: 2

  stat_mean_error:
    figsize: [8, 6]
    error_type: "sem"
    use_fill: False
    labels: ["Group", "Individual"]
    show_diff: True
    diff_mode: "gradient"
    diff_ylabel: "Gradient"
    xlabel: "Trials"
    ylabel: "Value"

  supplement_dd_box:
    figsize: [5, 4]
    ylabel: "DD"
    title: "Diagonal Dominance (DD)"
    show_legend: False
    show_sub_label: True

  supplement_nd_box:
    figsize: [5, 4]
    ylabel: "ND"
    title: "Normalized Distance (ND)"
    show_legend: False
    show_sub_label: True

  supplement_structure_space:
    figsize: [6, 5]
    xlabel: "DD"
    ylabel: "ND"
    title: "Structure Space"
    s: 60
    alpha: 0.9
    legend: True
