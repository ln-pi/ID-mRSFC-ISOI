# Usable A-series example; configure actual recording paths before FC/preprocessing.
paths:                                                       #	Locations of input, output and log files.
  raw: data\raw\                                             #	Directory containing raw recordings.
  processed: data\processed\                                 #	Directory containing preprocessed recordings.
  output: data\output\                                       #	Root directory for analysis outputs.
  mask: data\mask\                                           #	Directory containing atlas masks.
  log: data/output/_logs/default.log                         #	Path of the workflow log file.
variables:                                                   #	Dataset identity and ordered acquisition IDs.
  series: Aseries                                            #	Series label used to identify the dataset and reports.
  dataset: ''                                                #	Name of the dataset subdirectory.
  Week_ids:                                                  #	Ordered acquisition week identifiers.
  - 00w
  - 01w
  - 02w
  - 03w
  - 04w
  - 05w
  - 06w
  - 07w
  - 08w
  - 09w
  - 10w
  - 11w
  - 12w
  - 13w
  Mouse_ids:                                                 #	Ordered animal identifiers in this series.
  - A01
  - A02
  - A03
  - A04
  - A05
  - A06
  - A07
  - A08
  - A09
  - A10
  Run_ids:                                                   #	Ordered acquisition run identifiers.
  - Run01
  - Run02
  Atlas:                                                     #	Ordered atlas partitions used for analysis.
  - - SM
    - VIS
    - AUD
  - - PF
    - LAT
    - MED
    - AUDv
  - - AUDv
preprocess:                                                  #	Preprocessing options.
  keepna: false                                              #	Keep recording traces with invalid values during preprocessing.
  resume: true                                               #	Reuse verified artifacts from previous runs.
correlation:                                                 #	Functional connectivity calculation options.
  resume: true                                               #	Reuse verified artifacts from previous runs.
analysis:                                                    #	Global analysis and output settings.
  split_axis: week                                           #	Axis split into disjoint identification halves.
  selection_mode: single                                     #	Use individual or cumulative observation selections.
  statistics_file: statistics.pkl                            #	Filename for the combined identification statistics.
ID:                                                          #	Identification and permutation settings.
  completeness_mode: strict                                  #	Rule for selecting complete identification observations.
  group_mode: random                                         #	Method for splitting observations into disjoint halves.
  session_seed: 42                                           #	Random seed for splitting observations and shuffling labels.
  shuffle: true                                              #	Run the permutation analysis for identification.
  n_iter: 1000                                               #	Number of identification permutations.
visualization:                                               #	Report and diagnostic plotting settings.
  colormaps:                                                 #	Global continuous color maps grouped by presentation purpose.
    sequential: inferno                                      #	Color map for ordered values, magnitude and similarity.
    diverging: coolwarm                                      #	Color map for signed departures centered at zero.
  edge_graph:                                                #	Common circular edge graph settings.
    threshold: 99                                            #	Percentile used to select edges for the circular graph.
    gap: 0.25                                                #	Spacing between hemispheres in the circular graph.
    cross_only: false                                        #	Draw only edges that cross hemispheres.
    save_mat: true                                           #	Save the edge graph matrix preview.
  defaults:                                                  #	Default figure rendering options.
    dpi: 180                                                 #	Resolution in dots per inch.
    render_dpi: 300                                          #	Resolution used when rendering saved figures.
    show: false                                              #	Display plot windows interactively.
    save: true                                               #	Write generated figures to disk.
    log: false                                               #	Log figure rendering and save events.
  fc_heatmap:                                                #	Style of per-acquisition signed FC heatmaps.
    figsize:                                                 #	Figure width and height in inches.
    - 8
    - 8
    square: true                                             #	Use square heatmap cells.
    cbar: true                                               #	Show the colorbar.
    label_fontsize_small: 10                                 #	Minimum font size for ROI tick labels.
    label_fontsize_scale: 300                                #	Scale factor for ROI label sizing.
  id_shuffle_hist:                                           #	Style of identification permutation histograms.
    figsize:                                                 #	Figure width and height in inches.
    - 5
    - 4
    bins: 20                                                 #	Number of histogram bins.
    range:                                                   #	Minimum and maximum of the histogram bin range.
    - 0
    - 1
    facecolor: lightgray                                     #	Fill color of histogram bars.
    edgecolor: dimgray                                       #	Outline color of histogram bars.
    arrow_color: red                                         #	Color of the observed accuracy annotation.
    show_mean_arrow: true                                    #	Annotate the mean shuffled accuracy.
    mean_arrow_color: gray                                   #	Color of the shuffled accuracy annotation.
    xlabel: Identification Accuracy                          #	Text of the horizontal axis label.
    ylabel: Count                                            #	Text of the vertical axis label.
    title: Shuffle Distribution                              #	Figure title.
    arrow_text_format: real={:.4f}                           #	Template for displaying observed accuracy.
    mean_text_format: shuffle={:.4f}                         #	Template for displaying mean shuffled accuracy.
  id_paired:                                                 #	Style of paired group and individual plots.
    figsize:                                                 #	Figure width and height in inches.
    - 4
    - 6
    linecolor: gray                                          #	Color of the lines linking paired observations.
    alpha: 0.5                                               #	Opacity of the plotted observations.
    linewidth: 1.5                                           #	Width of observation lines.
    meancolor: red                                           #	Color used to draw the mean.
    meanwidth: 3                                             #	Width of the mean line.
    xticklabels:                                             #	Labels for positions on the horizontal axis.
    - Group
    - Individual
    ylabel: Network Similarity                               #	Text of the vertical axis label.
  id_similarity_matrix:                                      #	Style of combined identification similarity matrices.
    figsize:                                                 #	Figure width and height in inches.
    - 6
    - 6
    title: Similarity Matrix                                 #	Figure title.
    cbar: true                                               #	Show the colorbar.
    axis: true                                               #	Show the matrix axes.
    tick_fontsize: 10                                        #	Font size for axis tick labels.
  edge_phi:                                                  #	Circular graph style for phi edge contributions.
    node_color_mode: fixed                                   #	Rule for coloring graph nodes.
    edge_color_mode: fixed                                   #	Rule for coloring graph edges.
    edge_fixed_color: blue                                   #	Edge color when fixed coloring is selected.
    edge_width_mode: fixed                                   #	Rule for assigning edge widths.
  edge_dp:                                                   #	Circular graph style for dp edge contributions.
    node_color_mode: fixed                                   #	Rule for coloring graph nodes.
    edge_color_mode: fixed                                   #	Rule for coloring graph edges.
    edge_fixed_color: red                                    #	Edge color when fixed coloring is selected.
    edge_width_mode: fixed                                   #	Rule for assigning edge widths.
  stat_box:                                                  #	Common style for statistical box plots.
    figsize:                                                 #	Figure width and height in inches.
    - 4
    - 4
    box_width: 0.1                                           #	Width of each box.
    box_alpha: 0.7                                           #	Opacity of each box fill.
    box_color: null                                          #	Box fill color when explicitly set.
    showfliers: false                                        #	Show observations outside the whiskers.
    fontsize: 7                                              #	Base font size in points.
    rotation: 0                                              #	Rotation angle of tick labels in degrees.
    grid: false                                              #	Show background grid lines.
    hide_ns: true                                            #	Hide non-significant statistical annotations.
  stat_rel_effect_box:                                       #	Overrides for relative effect box plots.
    show_legend: false                                       #	Show the plot legend.
    show_sub_label: true                                     #	Show labels for the plotted subgroups.
  stat_group_indiv_box:                                      #	Overrides for paired group and individual box plots.
    group_gap: 2                                             #	Spacing between groups of boxes.
  stat_mean_error:                                           #	Style of mean and uncertainty plots.
    figsize:                                                 #	Figure width and height in inches.
    - 8
    - 6
    error_type: sem                                          #	Statistic used for the uncertainty display.
    use_fill: false                                          #	Use a shaded uncertainty band.
    labels:                                                  #	Display labels for the plotted series.
    - Group
    - Individual
    show_diff: true                                          #	Display the difference between plotted series.
    diff_mode: gradient                                      #	Representation used for the difference plot.
    diff_ylabel: Gradient                                    #	Vertical axis label for the difference plot.
    xlabel: Trials                                           #	Text of the horizontal axis label.
    ylabel: Value                                            #	Text of the vertical axis label.
  time_start: start                                          #	Display all saved weeks or start at the reference week.
  color_scale:                                               #	Color normalization defaults or metric overrides.
    mode: auto                                               #	Calculate limits automatically or use explicitly fixed limits.
    scope: batch                                             #	Share color limits within the displayed batch.
  missing_color: lightgray                                   #	Color for missing heatmap cells.
  under_color: '#d73027'                                     #	Color for data below the displayed range.
  over_color: '#762a83'                                      #	Color for data above the displayed range.
  metrics:                                                   #	Color mapping rules for individual plot metrics.
    regional_variance:                                       #	Color policy for the regional variance plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    regions_direction:                                       #	Color policy for the regions direction plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    sd:                                                      #	Color policy for the sd plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    cv:                                                      #	Color policy for the cv plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    within_similarity:                                       #	Color policy for the within similarity plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    reference_similarity:                                    #	Color policy for the reference similarity plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    icc:                                                     #	Color policy for the icc plots.
      color_mode: diverging                                  #	Choose the sequential or diverging color map role.
      color_scale:                                           #	Color normalization defaults or metric overrides.
        mode: fixed                                          #	Calculate limits automatically or use explicitly fixed limits.
        limits:                                              #	Lower and upper limits for a fixed color scale.
        - -1
        - 1
    variance_component:                                      #	Color policy for the variance component plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    variance_component_icc:                                  #	Color policy for the variance component icc plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
      color_scale:                                           #	Color normalization defaults or metric overrides.
        mode: fixed                                          #	Calculate limits automatically or use explicitly fixed limits.
        limits:                                              #	Lower and upper limits for a fixed color scale.
        - 0
        - 1
    signed_offset:                                           #	Color policy for the signed offset plots.
      color_mode: diverging                                  #	Choose the sequential or diverging color map role.
    distance:                                                #	Color policy for the distance plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    correlation_distance:                                    #	Color policy for the correlation distance plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
      color_scale:                                           #	Color normalization defaults or metric overrides.
        mode: fixed                                          #	Calculate limits automatically or use explicitly fixed limits.
        limits:                                              #	Lower and upper limits for a fixed color scale.
        - 0
        - 2
    pairwise:                                                #	Color policy for the pairwise plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    fc_heatmap:                                              #	Color policy for the fc heatmap plots.
      color_mode: diverging                                  #	Choose the sequential or diverging color map role.
      color_scale:                                           #	Color normalization defaults or metric overrides.
        mode: fixed                                          #	Calculate limits automatically or use explicitly fixed limits.
        limits:                                              #	Lower and upper limits for a fixed color scale.
        - -1
        - 1
    id_similarity_matrix:                                    #	Color policy for the id similarity matrix plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    alignment_intensity:                                     #	Color policy for the alignment intensity plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
    edge_contribution:                                       #	Color policy for the edge contribution plots.
      color_mode: sequential                                 #	Choose the sequential or diverging color map role.
  supplement:                                                #	Supplementary report figure styles.
    dpi: 150                                                 #	Resolution in dots per inch.
    formats:                                                 #	File formats written for supplementary figures.
    - png
    - pdf
    panel_size:                                              #	Width and height of one supplementary plot panel in inches.
    - 5.2
    - 3.8
    font_size: 9                                             #	Base font size of supplementary figures.
  series_colors:                                             #	Categorical colors used for series side or group.
  - '#356caa'
  - '#bd502f'
  view_markers:                                              #	Marker shapes used to distinguish acquisition views.
  - o
  - ^
  - s
  - D
  - x
  trajectory_figsize: [19, 4.5]                              #	Width and height of the combined trajectory figure in inches.
  graph_palette: tab10                                       #	Categorical palette used for graph network labels.
  alignment:                                                 #	Styling for the interactive alignment preview.
    overlay_alpha: 0.15                                      #	Opacity of the atlas label overlay.
    atlas_palette: tab20                                     #	Categorical palette for the atlas region labels.
pairwise:                                                    #	Week-pair selections and phase definitions.
  phases:                                                    #	Grouping of acquisition weeks into named phases.
    onset:                                                   #	Weeks assigned to the onset phase.
    - 00w
    - 01w
    - 02w
    baseline:                                                #	Weeks assigned to the baseline phase.
    - 03w
    early:                                                   #	Weeks assigned to the early phase.
    - 04w
    - 05w
    - 06w
    middle:                                                  #	Weeks assigned to the middle phase.
    - 07w
    - 08w
    - 09w
    - 10w
    late:                                                    #	Weeks assigned to the late phase.
    - 11w
    - 12w
    - 13w
  phase_comparisons:                                         #	Ordered phase pairs used in pairwise comparisons.
  - - baseline
    - onset
  - - baseline
    - early
  - - baseline
    - middle
  - - baseline
    - late
  - - early
    - middle
  - - middle
    - late
  window_interpretation: N_aligned_observation_windows       #	Label describing the meaning of the observation windows.
descriptive:                                                 #	Descriptive analysis and shared SeedFC selection settings.
  reference_week: 03w                                        #	Reference acquisition week used for baseline comparisons.
plugins:                                                     #	Source and function plugins.
  source: {}                                                 #	Use the native FC source when empty.
  function:                                                  #	Optional analysis functions.
    geometry:                                                #	High-dimensional analysis plugin.
      enabled: false                                         #	Run high-dimensional geometry and inference.
    seedfc_supplement:                                       #	Supplementary SeedFC metrics and reports.
      enabled: false                                         #	Enable this plugin or postprocessing task.
      options:                                               #	Supplementary metrics and matrix options.
        cohorts:                                             #	Cohort policies to calculate for supplementary metrics.
        - available_pair
        cv_mean_threshold: 1.0e-06                           #	Minimum absolute edge mean for regional CV aggregation.
        numerical_tolerance: 1.0e-12                         #	Tolerance used to reject unstable numerical denominators.
        icc_min_mice: 3                                      #	Minimum number of paired animals for ICC.
        matrix_weeks:                                        #	Weeks eligible for representative similarity matrices.
        - 03w
        - 07w
        - 13w
