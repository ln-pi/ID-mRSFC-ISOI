[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ID-mRSFC-ISOI"
version = "0.2.0"
description = "Longitudinal mouse resting-state connectivity workflow"
requires-python = ">=3.13"
dependencies = ["numpy", "pandas", "scipy", "PyYAML", "Pillow", "matplotlib", "seaborn", "statsmodels", "tqdm"]

[project.optional-dependencies]
preprocessing = ["suite2p>=1.1", "opencv-python-headless", "tifffile", "PyQt6"]
test = ["pytest"]

[project.scripts]
isoi = "run:main"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
where = ["."]
include = ["srcs*"]
exclude = ["srcs.legacy.snapshot*"]
namespaces = false

[tool.setuptools.package-data]
"srcs.atlas" = ["*.pkl", "*.npy", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
