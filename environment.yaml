# Unified analysis + Suite2p environment. Suite2p 1.1.0 was the latest stable release checked on 2026-09-24.
# Scientific Python packages are installed together by pip to avoid duplicate Conda/pip builds.
# opencv -> opencv-python-headless; pyqt -> PyQt6 (Suite2p GUI uses Qt6).
name: ID-mRSFC-ISOI_suite2p
channels:
- conda-forge
- nodefaults
dependencies:
- python=3.13.13
- pip
- pip:
  - numpy>=1.24.3
  - scipy
  - pandas
  - matplotlib
  - pyyaml
  - tqdm
  - seaborn
  - scikit-learn
  - statsmodels
  - networkx
  - igraph
  - pillow
  - imageio
  - tifffile
  - jupyter
  - ipykernel
  - pingouin
  - pyvis
  - cdlib
  - dynetx
  - hmmlearn
  - opencv-python-headless
  - numba
  - PyQt6
  - suite2p[gui]==1.1.0
