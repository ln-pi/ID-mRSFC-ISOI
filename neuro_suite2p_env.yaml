name: neuro_suite2p_env

channels:
  - conda-forge
  - defaults

dependencies:
  # Suite2p's current upstream installation notes recommend Python 3.11.
  - python=3.11
  - pip
  - numpy>=1.24.3
  - scipy
  - pandas
  - matplotlib
  - pyqt
  - pyyaml
  - tqdm
  - tifffile
  - pillow
  - opencv

  - pip:
      - suite2p==1.0.0.1
